<div class="search-box">
  <input
    type="text"
    class="search-input"
    oninput="onSearchInput(this)"
    placeholder="检索题目、作者、期刊或年份"
  />
  <button
    disabled
    data-tooltip="清除检索"
    aria-label="清除检索"
    onclick="onSearchClear()"
  >
    {% include icon.html icon="fa-solid fa-magnifying-glass" %}
  </button>
</div>
