# site properties and page defaults
title: "蟹黄堡实验室"
subtitle: "Xie-Huangbao Laboratory · 谢天谢地"
description: "蟹黄堡实验室以认知神经科学为基础，研究自我加工、社会认知、共情及精神分裂症相关机制。我们重视理论问题与可检验预测的衔接，也关注实验范式、脑电指标和计算模型如何服务真实世界中的心理评估。"
header: images/background.jpg
footer: images/background.jpg
proofer: false

# site social media and other links
logo: images/lab-logo.png
lang: zh-CN
url: https://xiehuangbaolab.top
baseurl: ""
links:
  email: "xiepeipeipsy@163.com"
  github: hcz13320724256/xie-huangbao-lab

### jekyll settings

# front matter defaults
defaults:
  # all markdown files
  - scope:
      path: ""
    values:
      layout: default
  # markdown files in /_members
  - scope:
      type: "members"
    values:
      layout: member
  # markdown files in /_posts
  - scope:
      type: "posts"
    values:
      layout: post

collections:
  # generate page for each member
  members:
    output: true
  # generate page for each post
  posts:
    output: true

# jekyll plugins
plugins:
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-last-modified-at

# code block syntax highlighting
highlighter: rouge

# jekyll theme
theme: null

# sass settings
sass:
  sass_dir: _styles

# force jekyll to include certain files/folders
include:
  - _styles
  - _scripts

# force jekyll to exclude certain files/folders
exclude:
  - README.md
  - LICENSE.md
  - CITATION.cff
  - testbed.md
  - CHANGELOG.md
  - scripts
  - public-content-backup.json

# configure jekyll spaceship
jekyll-spaceship:
  mathjax-processor:
    src:
      - https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js
